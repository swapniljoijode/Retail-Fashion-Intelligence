name: fashion_retail
version: "1.0.0"
config-version: 2

profile: fashion_retail

model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# ── Model materializations and schema assignments ─────────────────────────────
models:
  fashion_retail:
    staging:
      +materialized: view
      +schema: staging
      +docs:
        show: true
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +docs:
        show: true

# ── Elementary observability ─────────────────────────────────────────────────
# Elementary's incremental models (data_monitoring_metrics, dbt_models,
# dbt_run_results, etc.) run as part of dbt build and populate the Elementary
# schema automatically — no on-run-end hook needed.
#
# Note: upload_dbt_artifacts_v2() in on-run-end is incompatible with dbt 1.11
# because Elementary injects an 'elementary' dict var that shadows the package
# namespace in Jinja, causing "dict object has no attribute" errors.
# Run `edr report` directly after dbt build to generate the observability HTML.

# ── Variables ─────────────────────────────────────────────────────────────────
vars:
  # Maximum number of SCD versions expected per product / customer.
  # Used in dbt-expectations distribution tests.
  max_scd_versions: 3
  # Note: do NOT add an 'elementary' var here — it shadows the Elementary
  # package namespace in Jinja and breaks the upload_dbt_artifacts_v2() hook.
  # Elementary's default days_back of 14 is sufficient.
