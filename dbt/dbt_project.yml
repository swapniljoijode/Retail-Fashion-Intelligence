name: fashion_retail
version: "1.0.0"
config-version: 2

profile: fashion_retail

model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# ── Model materializations and schema assignments ─────────────────────────────
models:
  fashion_retail:
    staging:
      +materialized: view
      +schema: staging
      +docs:
        show: true
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +docs:
        show: true

# ── Elementary observability hooks ───────────────────────────────────────────
# Uploads dbt artifacts (manifest, run_results, sources) to the Elementary
# schema after every dbt run so edr can surface test results and freshness.
on-run-end:
  - "{{ elementary.upload_dbt_artifacts_v2() }}"

# ── Variables ─────────────────────────────────────────────────────────────────
vars:
  # Maximum number of SCD versions expected per product / customer.
  # Used in dbt-expectations distribution tests.
  max_scd_versions: 3
  # Note: do NOT add an 'elementary' var here — it shadows the Elementary
  # package namespace in Jinja and breaks the upload_dbt_artifacts_v2() hook.
  # Elementary's default days_back of 14 is sufficient.
