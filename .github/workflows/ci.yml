name: CI

# Triggered on every push to main and on every pull request targeting main.
# Stages: lint → (unit tests ‖ integration smoke) → docker build
# The docker build job only runs when both test jobs pass, enforcing the merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a running pipeline if a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION:     "0.4.29"

jobs:

  # ── Stage 1: Lint ───────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff · black · sqlfluff)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install all extras (dev + dbt)
        run: uv sync --all-extras

      - name: ruff — fast Python linter
        run: uv run ruff check .

      - name: black — formatting check (no changes allowed)
        run: uv run black --check .

      - name: sqlfluff — SQL lint (Snowflake dialect)
        # Runs inside the dbt/ directory so sqlfluff can resolve the dbt project.
        run: cd dbt && uv run sqlfluff lint models/ --dialect snowflake

  # ── Stage 2a: Unit + bronze tests (fast, no dbt) ───────────────────────────
  test-unit:
    name: "Unit + bronze tests"
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: pytest — unit and bronze layer tests
        # Excludes @pytest.mark.integration (smoke test) for fast feedback.
        run: uv run pytest tests/ -v --tb=short -m "not integration"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 7

  # ── Stage 2b: Integration smoke test (generate → bronze → dbt build) ───────
  test-integration:
    name: "Integration smoke (generate → bronze → dbt build → gold assertions)"
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (including dbt)
        run: uv sync --all-extras

      # Cache dbt_packages across runs — invalidated only when packages.yml changes.
      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml') }}
          restore-keys: dbt-packages-

      # dbt deps needs a profiles.yml to parse even though it never connects.
      # We use an in-memory DuckDB so no real database is required.
      - name: Create CI dbt profiles.yml (in-memory DuckDB)
        run: |
          cat > dbt/profiles.yml << 'PROFILES'
          fashion_retail:
            target: duckdb
            outputs:
              duckdb:
                type: duckdb
                path: ":memory:"
                threads: 4
          PROFILES

      - name: dbt deps — install dbt-expectations package
        run: cd dbt && uv run dbt deps --profiles-dir . --no-partial-parse

      - name: pytest — integration smoke test
        # The smoke test fixture writes its own temp profiles.yml pointing
        # at a fresh temp DuckDB, so the in-memory profile above is only
        # needed for the dbt deps step above.
        run: uv run pytest tests/test_smoke_pipeline.py -v --tb=short --no-cov -m ""

  # ── Stage 3: Docker image build ────────────────────────────────────────────
  # Only runs after BOTH test jobs pass, enforcing the merge gate.
  docker-build:
    name: "Docker build — app image"
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # BuildKit inline cache speeds up repeat builds by up to 80 %.
      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    docker/app/Dockerfile
          push:    false
          tags:    fashion-retail-app:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
