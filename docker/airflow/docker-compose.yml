---
# Fashion Retail Intelligence — Airflow Stack
#
# Uses LocalExecutor with PostgreSQL for the metadata DB.
# No Redis / CeleryExecutor needed for a single-machine portfolio demo.
#
# Usage (run from project root):
#   make airflow-init   # first-time setup: migrate DB, create admin user
#   make airflow-up     # start webserver + scheduler
#   make airflow-down   # stop all containers
#   make airflow-logs   # tail combined logs
#
# UI: http://localhost:8080  (admin / admin)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:-}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Make project packages importable inside Airflow tasks
    PYTHONPATH: /opt/airflow
    # Cloudflare R2 — pass through from host .env if set
    R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
    R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
    R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
    R2_RAW_BUCKET: "${R2_RAW_BUCKET:-fashion-retail-raw}"
    R2_SERVED_BUCKET: "${R2_SERVED_BUCKET:-fashion-retail-served}"
  volumes:
    # DAGs — live-reload without rebuilding the image
    - ../../orchestration/dags:/opt/airflow/dags:ro
    # Project source — importable via PYTHONPATH
    - ../../data_generation:/opt/airflow/data_generation:ro
    - ../../ingestion:/opt/airflow/ingestion:ro
    # dbt project — read-only; profiles.yml injected from this directory
    - ../../dbt:/opt/airflow/dbt:ro
    - ./dbt_profiles.yml:/opt/airflow/dbt/profiles.yml:ro
    # Shared data volume — DuckDB file, generated Parquet, served snapshot
    - ../../data:/opt/airflow/data
    # Airflow logs
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL metadata database ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-airflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-airflow}"
      POSTGRES_DB: "${POSTGRES_DB:-airflow}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── One-off initialisation (migrate DB + create admin user) ──────────────────
  # Run with:  docker compose run --rm airflow-init
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin --lastname User \
          --role Admin \
          --email admin@fashionretail.local
        echo "Airflow initialised successfully."
    restart: "no"

  # ── Webserver (UI on :8080) ───────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Scheduler ────────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
