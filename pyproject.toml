[project]
name = "fashion-retail-intelligence"
version = "0.1.0"
description = "End-to-end fashion retail medallion data platform"
requires-python = ">=3.11"
dependencies = [
    # Data generation
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    # Cloud storage
    "boto3>=1.34.0",
    # Warehouse shadow — DuckDB bronze layer and CI testing
    "duckdb>=0.10.0",
    # Config and secrets
    "python-dotenv>=1.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
# dbt adapters — installed separately when running Phase 4+.
# dbt-expectations is NOT a pip package; install it via dbt/packages.yml.
# Python <=3.12 required for dbt-core 1.8.x.
dbt = [
    "dbt-core>=1.8.0,<2.0.0",
    "dbt-duckdb>=1.8.0,<2.0.0",
    "dbt-snowflake>=1.8.0,<2.0.0",
]
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0",
    "sqlfluff>=3.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_generation", "ingestion"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Default run excludes slow integration tests. Use make test-all to include them.
addopts = "--cov=data_generation --cov=ingestion --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests including dbt build (slow; needs dbt installed)",
]

[tool.sqlfluff.core]
dialect = "snowflake"
templater = "dbt"
sql_file_exts = ".sql"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"
