[project]
name = "fashion-retail-intelligence"
version = "0.1.0"
description = "End-to-end fashion retail medallion data platform"
requires-python = ">=3.11"
dependencies = [
    # Data generation
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    # Cloud storage
    "boto3>=1.34.0",
    # Config and secrets
    "python-dotenv>=1.0.0",
    # dbt (core + adapters)
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dbt-snowflake>=1.8.0",
    "dbt-expectations>=0.10.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0",
    "sqlfluff>=3.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=data_generation --cov=ingestion --cov-report=term-missing"

[tool.sqlfluff.core]
dialect = "snowflake"
templater = "dbt"
sql_file_exts = ".sql"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"
